name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Go for actionlint
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Check for zero-byte source files
        run: |
          # Audit P0-1: core source files must never be 0 bytes (installer.mjs regression).
          # Find all tracked files that are empty and fail if any exist.
          EMPTY_FILES=$(find . -type f -size 0 -not -path './.git/*' -not -path './node_modules/*' -not -path './dist/*' || true)
          if [ -n "$EMPTY_FILES" ]; then
            echo "::error::Found zero-byte files (must not be empty):"
            echo "$EMPTY_FILES"
            exit 1
          fi
          echo "No zero-byte files found."

      - name: Run quality gates
        run: npm run ci:quality
